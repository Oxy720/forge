<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FORGE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#1a1a1a; --surface:#222; --border:#2e2e2e; --text:#d4d4d4;
    --muted:#555; --accent:#4a9eff; --success:#3dba6f; --warning:#e8a830;
    --danger:#e05555; --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  }
  body { background:var(--bg); color:var(--text); font-family:var(--sans); font-size:12px; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  .header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .header-title { font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .btn-icon { background:none; border:1px solid var(--border); color:var(--muted); padding:3px 8px; font-family:var(--mono); font-size:10px; cursor:pointer; border-radius:2px; letter-spacing:.05em; }
  .btn-icon:hover { border-color:var(--accent); color:var(--accent); }
  .filterbar { display:flex; gap:1px; padding:8px 14px 0; flex-shrink:0; }
  .filter-btn { background:none; border:none; color:var(--muted); font-family:var(--mono); font-size:10px; padding:3px 10px; cursor:pointer; border-radius:2px; letter-spacing:.05em; }
  .filter-btn:hover { color:var(--text); }
  .filter-btn.active { background:var(--surface); color:var(--text); }
  .searchbar { padding:8px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .search-input { width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:var(--mono); font-size:10px; padding:5px 10px; border-radius:2px; outline:none; }
  .search-input::placeholder { color:var(--muted); }
  .search-input:focus { border-color:var(--accent); }
  .plugin-list { flex:1; overflow-y:auto; padding:6px 0; }
  .plugin-list::-webkit-scrollbar { width:3px; }
  .plugin-list::-webkit-scrollbar-thumb { background:var(--border); }
  .plugin-item { border-bottom:1px solid var(--border); }
  .plugin-row { display:flex; align-items:center; padding:9px 14px; gap:10px; cursor:pointer; user-select:none; }
  .plugin-row:hover { background:var(--surface); }
  .plugin-info { flex:1; min-width:0; }
  .plugin-name { font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .plugin-desc { font-size:10px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .plugin-version { font-family:var(--mono); font-size:10px; color:var(--muted); flex-shrink:0; width:36px; text-align:right; }
  .chevron { color:var(--muted); font-size:9px; flex-shrink:0; transition:transform .2s; width:10px; text-align:center; }
  .plugin-item.open .chevron { transform:rotate(90deg); }
  .status-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .status-dot.installed { background:var(--success); }
  .status-dot.update    { background:var(--warning); }
  .status-dot.none      { background:var(--border); }
  .btn-action { font-family:var(--mono); font-size:10px; padding:4px 10px; border-radius:2px; cursor:pointer; border:1px solid; flex-shrink:0; letter-spacing:.04em; min-width:62px; text-align:center; }
  .btn-action.install   { border-color:var(--accent);  color:var(--accent);  background:transparent; }
  .btn-action.install:hover { background:var(--accent); color:#fff; }
  .btn-action.update    { border-color:var(--warning); color:var(--warning); background:transparent; }
  .btn-action.installed { border-color:var(--border);  color:var(--muted);   background:transparent; cursor:default; }
  .btn-action.installing { border-color:var(--border); color:var(--muted); background:transparent; cursor:wait; }
  .plugin-dropdown { max-height:0; overflow:hidden; transition:max-height .25s ease; background:#1e1e1e; }
  .plugin-item.open .plugin-dropdown { max-height:300px; }
  .dropdown-inner { padding:10px 14px 12px 30px; border-top:1px solid var(--border); }
  .dropdown-full-desc { font-size:11px; color:#aaa; line-height:1.6; margin-bottom:10px; }
  .features-label { font-family:var(--mono); font-size:9px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
  .features-list { display:flex; flex-direction:column; gap:4px; }
  .feature-item { font-size:11px; color:#999; display:flex; align-items:flex-start; gap:7px; }
  .feature-item::before { content:'—'; color:var(--muted); flex-shrink:0; font-family:var(--mono); }
  .tags-row { display:flex; flex-wrap:wrap; gap:4px; margin-top:10px; }
  .tag { font-family:var(--mono); font-size:9px; color:var(--muted); border:1px solid var(--border); padding:1px 6px; border-radius:2px; }
  .footer { padding:7px 14px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .footer-status { font-family:var(--mono); font-size:10px; color:var(--muted); }
  .footer-status span { color:var(--text); }
  .btn-refresh { background:none; border:none; color:var(--muted); font-family:var(--mono); font-size:10px; cursor:pointer; }
  .btn-refresh:hover { color:var(--accent); }
  .empty { display:flex; align-items:center; justify-content:center; height:80px; color:var(--muted); font-family:var(--mono); font-size:11px; }
  .toast { position:fixed; bottom:36px; left:50%; transform:translateX(-50%) translateY(8px); background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:var(--mono); font-size:10px; padding:6px 14px; border-radius:2px; opacity:0; transition:all .2s; pointer-events:none; white-space:nowrap; z-index:100; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  .toast.success { border-color:var(--success); color:var(--success); }
  .toast.error   { border-color:var(--danger);  color:var(--danger);  cursor:pointer; }
</style>
</head>
<body>

<div class="header">
  <span class="header-title">FORGE</span>
  <button class="btn-icon" onclick="FORGE.loadPlugins()">check updates</button>
</div>

<div class="filterbar">
  <button class="filter-btn active" onclick="FORGE.setFilter('all', this)">all</button>
  <button class="filter-btn" onclick="FORGE.setFilter('installed', this)">installed</button>
  <button class="filter-btn" onclick="FORGE.setFilter('available', this)">available</button>
  <button class="filter-btn" onclick="FORGE.setFilter('update', this)">updates</button>
</div>

<div class="searchbar">
  <input class="search-input" type="text" placeholder="search plugins..." oninput="FORGE.onSearch(this.value)"/>
</div>

<div class="plugin-list" id="pluginList"></div>

<div class="footer">
  <span class="footer-status"><span id="installedCount">0</span> installed &nbsp;·&nbsp; <span id="totalCount">0</span> total</span>
  <button class="btn-refresh" onclick="FORGE.loadPlugins()">↻ refresh</button>
</div>

<div class="toast" id="toast"></div>

<script>require(__dirname + '/js/app.js');</script>

</body>
</html>
